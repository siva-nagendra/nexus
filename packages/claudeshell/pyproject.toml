[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "claudeshell"
version = "3.0.0"
description = "DCC-agnostic Claude terminal relay"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "websockets>=14.0,<15.0",
    "pywinpty>=2.0; sys_platform == 'win32'",
    "pexpect>=4.8; sys_platform != 'win32'",
]

[project.scripts]
claudeshell = "claudeshell.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/claudeshell"]
