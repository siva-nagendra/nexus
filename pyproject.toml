[project]
name = "nexus"
version = "0.2.0"
description = "Unreal Engine 5.7 MCP server — workflow-oriented tools over native TCP"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Nexus Team" }]
dependencies = [
    "fastmcp>=3.1.1",
    "pydantic>=2.0",
    "orjson>=3.10",
    "httpx>=0.28",
    "aiofiles>=24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "pyright>=1.1",
]

[project.scripts]
nexus = "nexus.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nexus"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.lint.per-file-ignores]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "packages/claudeshell/tests"]
markers = [
    "integration: requires running Unreal Engine instance",
]
